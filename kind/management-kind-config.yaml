# Kind cluster: management - runs Argo CD
# API server bound to 127.0.0.1:33443 (avoid kubeconfig https://0.0.0.0 which breaks TLS).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 33443
  # Disable default CNI so we can install Cilium explicitly.
  disableDefaultCNI: true
  podSubnet: 10.200.0.0/16
  serviceSubnet: 10.220.0.0/16

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
      SystemdCgroup = true

nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
