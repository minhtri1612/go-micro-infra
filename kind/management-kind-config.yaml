# Kind cluster: management - runs Argo CD
# API server bound to 127.0.0.1:33443 (avoid kubeconfig https://0.0.0.0 which breaks TLS).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 33443
  # kindnet (default).
  disableDefaultCNI: false
  podSubnet: 10.200.0.0/16
  serviceSubnet: 10.220.0.0/16

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
      SystemdCgroup = true

nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
    extraPortMappings:
      - containerPort: 30443
        hostPort: 18080
        listenAddress: "0.0.0.0"
        protocol: TCP
      # Grafana / Prometheus NodePorts on management (kube-prometheus-stack).
      # Only applied at `kind create`. Existing cluster: kind/host-nodeport-proxy.sh
      - containerPort: 32000
        hostPort: 32000
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 32090
        hostPort: 32090
        listenAddress: "0.0.0.0"
        protocol: TCP
