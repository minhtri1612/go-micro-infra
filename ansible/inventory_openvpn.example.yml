# Ansible reaches the OpenVPN host over SSM, not SSH: no key pair, no port 22.
# Copy to inventory_openvpn.yml and fill the instance id from
#   terraform -chdir=environments/rke2-management output openvpn_instance_id
#
# Needs: pip install boto3 ; ansible-galaxy collection install amazon.aws community.aws
# plus the AWS session-manager-plugin on the machine running Ansible.
vpn_server:
  hosts:
    i-REPLACE_WITH_OPENVPN_INSTANCE_ID:
  vars:
    ansible_connection: community.aws.aws_ssm
    ansible_aws_ssm_region: ap-southeast-2
    # Reuse the Terraform state bucket for SSM file transfer.
    ansible_aws_ssm_bucket_name: go-micro-tfstate-REPLACE_WITH_ACCOUNT_ID
