# Workload clusters: Prometheus Agent (scrape in-cluster) + remote_write to management Prometheus.
# Management: prometheus.prometheusSpec.enableRemoteWriteReceiver + Service NodePort 32090 (monitoring-mgmt.yaml).
#
# remoteWrite URL — KHÔNG hardcode IP lâu dài. Cập nhật bằng:
#   MGMT_PROMETHEUS_REMOTE_WRITE_URL='http://<mgmt-prometheus>:32090/api/v1/write' \
#     ./scripts/sync-monitoring-remote-write-url.sh
#
# Management Prometheus nhận remote_write từ dev/prod qua peering.
# Port mặc định NodePort: 32090 (monitoring-mgmt.yaml → prometheus 9090).
#
# Test Prometheus management:
#   MGMT_PROMETHEUS_REMOTE_WRITE_URL='http://<ip>:32090/api/v1/write' \
#     ./scripts/sync-monitoring-remote-write-url.sh --check
# URL /-/ready:
#   curl -sS -o /dev/null -w "%{http_code}\n" "$(./scripts/sync-monitoring-remote-write-url.sh --print-ready-url)"
#
# Phân tách env trong Grafana: dùng label từ monitoring-workload-labels-{dev,staging,prod}.yaml
#   ví dụ: up{cluster="dev"}, kube_pod_*{cluster="staging"}

fullnameOverride: kps-wl
grafana:
  enabled: false
prometheus:
  enabled: true
  agentMode: true
  prometheusSpec:
    retention: 1d
    storageSpec:
      emptyDir:
        medium: ""
    remoteWrite:
      # Set via ./scripts/sync-monitoring-remote-write-url.sh (placeholder until RKE2 management Prometheus exists).
      - url: http://127.0.0.1:32090/api/v1/write
        name: management
        queueConfig:
          capacity: 10000
          maxShards: 50
          minShards: 1
          maxSamplesPerSend: 2000
          batchSendDeadline: 5s
          minBackoff: 30ms
          maxBackoff: 5s
alertmanager:
  enabled: false
prometheusOperator:
  enabled: true
prometheus-node-exporter:
  enabled: true
  service:
    type: ClusterIP
kube-state-metrics:
  enabled: true
  service:
    type: ClusterIP
# Disable system components to avoid 'kube-system' namespace permission issues
# (AppProject dev only allows monitoring/microservices/databases/traefik/argo-rollouts)
# Chart key is coreDns (not kubeCoreDns). Default enabled:true still emits Service kube-system/kps-wl-coredns.
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
