          },
          "id": 15,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (cluster, horizontalpodautoscaler, namespace) (kube_horizontalpodautoscaler_status_desired_replicas{cluster=~\"$cluster\"})",
              "legendFormat": "{{cluster}} {{namespace}}/{{horizontalpodautoscaler}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "HPA desired replicas",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 37
          },
          "id": 16,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (cluster, horizontalpodautoscaler, namespace) (kube_horizontalpodautoscaler_spec_max_replicas{cluster=~\"$cluster\"})",
              "legendFormat": "{{cluster}} {{namespace}}/{{horizontalpodautoscaler}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "HPA max replicas",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "go-micro",
        "rke2"
      ],
      "templating": {
        "list": [
          {
            "name": "cluster",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(up, cluster)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(kube_pod_info{cluster=~\"$cluster\"}, namespace)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2
          },
          {
            "name": "service",
            "type": "custom",
            "includeAll": true,
            "multi": true,
            "allValue": "product|inventory|order|payment|noti|client",
            "options": [
              {
                "text": "product",
                "value": "product"
              },
              {
                "text": "inventory",
                "value": "inventory"
              },
              {
                "text": "order",
                "value": "order"
              },
              {
                "text": "payment",
                "value": "payment"
              },
              {
                "text": "noti",
                "value": "noti"
              },
              {
                "text": "client",
                "value": "client"
              }
            ],
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Cluster & Infrastructure Health",
      "uid": "go-micro-cluster-health",
      "version": 1
    }
