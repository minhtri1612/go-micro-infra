apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik-metrics
  namespace: monitoring
  labels:
    release: monitoring-prod
spec:
  namespaceSelector:
    matchNames:
      - traefik
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
