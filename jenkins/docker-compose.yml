# Jenkins CI server. EC2 in the RKE2 management VPC — not a cluster pod.
# user root: docker.sock trên host (lab). Không phải mô hình Kubernetes agent.
# Secrets: AWS Secrets Manager go-micro/jenkins/runtime → ./scripts/load-runtime-env.sh → .env.runtime
services:
  jenkins:
    build: .
    image: go-micro-jenkins:local
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.runtime
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xms128m -Xmx512m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_home/casc_configs:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
