jenkins:
  systemMessage: "go-micro CI — Jenkins ngoài cluster. 1 job / service. CD = Argo CD."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: "TF_STATE_BUCKET"
            value: "${TF_STATE_BUCKET}"
          - key: "TF_ADMIN_INGRESS_CIDR"
            value: "${TF_ADMIN_INGRESS_CIDR}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: "dockerhub-credentials"
              scope: GLOBAL
              description: "Docker Hub (CI push images)"
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_TOKEN}"
          - usernamePassword:
              id: "github-go-micro-pat"
              scope: GLOBAL
              description: "GitHub PAT (clone service repos + push gitops)"
              username: "${GITHUB_USER}"
              password: "${GITHUB_PAT}"
          - usernamePassword:
              id: "aws-terraform"
              scope: GLOBAL
              description: "AWS for Terraform plan/apply on Jenkins (lab: same key; split plan-only later)"
              username: "${AWS_ACCESS_KEY_ID}"
              password: "${AWS_SECRET_ACCESS_KEY}"
          - string:
              id: "tf-db-password"
              scope: GLOBAL
              description: "TF_VAR_db_password"
              secret: "${TF_DB_PASSWORD}"
          - string:
              id: "tf-stripe-secret-key"
              scope: GLOBAL
              description: "TF_VAR_stripe_secret_key"
              secret: "${TF_STRIPE_SECRET_KEY}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  globalLibraries:
    libraries:
      - name: "go-micro-ci"
        defaultVersion: "main"
        implicit: false
        allowVersionOverride: true
        includeInChangesets: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/minhtri1612/go-micro-pipeline-lib.git"
                credentialsId: "github-go-micro-pat"

jobs:
  - file: /var/jenkins_home/casc_configs/jobs.groovy
