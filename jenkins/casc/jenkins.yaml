jenkins:
  systemMessage: "go-micro CI. Developer: services/* test only. Release: folder release/ (infra Jenkinsfile). Library pin tag, no version override."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    github:
      githubWebUri: "https://github.com"
      githubApiUri: "https://api.github.com"
      clientID: "${GITHUB_OAUTH_CLIENT_ID}"
      clientSecret: "${GITHUB_OAUTH_CLIENT_SECRET}"
      oauthScopes: "read:org,user:email"
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "${JENKINS_ADMIN_ID}"
          - name: "authenticated"
            permissions:
              - "Overall/Read"
            entries:
              - group: "authenticated"
          - name: "developer"
            permissions:
              - "Overall/Read"
            entries:
              - user: "${JENKINS_DEVELOPER_ID}"
        items:
          - name: "developer-services"
            pattern: "^services(/.*)?$"
            permissions:
              - "Job/Read"
              - "Job/Discover"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
            entries:
              - user: "${JENKINS_DEVELOPER_ID}"
          - name: "developer-release"
            pattern: "^release(/.*)?$"
            permissions:
              - "Job/Read"
              - "Job/Discover"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
            entries:
              - user: "${JENKINS_DEVELOPER_ID}"
          - name: "devops-release"
            pattern: "^release(/.*)?$"
            permissions:
              - "Job/Read"
              - "Job/Discover"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
              - "Job/Configure"
            entries:
              - user: "${JENKINS_ADMIN_ID}"
          - name: "devops-platform"
            pattern: "^platform(/.*)?$"
            permissions:
              - "Job/Read"
              - "Job/Discover"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
              - "Job/Configure"
            entries:
              - user: "${JENKINS_ADMIN_ID}"
  globalNodeProperties:
    - envVars:
        env:
          - key: "TF_STATE_BUCKET"
            value: "${TF_STATE_BUCKET}"
          - key: "TF_ADMIN_INGRESS_CIDR"
            value: "${TF_ADMIN_INGRESS_CIDR}"
          - key: "AWS_DEFAULT_REGION"
            value: "${AWS_DEFAULT_REGION:-ap-southeast-2}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: "github-go-micro-pat"
              scope: GLOBAL
              description: "GitHub PAT clone-only (library + service/infra SCM). Prefer read-only. Write GitOps is folder release/ github-gitops-write."
              username: "${GITHUB_USER}"
              password: "${GITHUB_PAT}"
          - usernamePassword:
              id: "aws-terraform-plan"
              scope: GLOBAL
              description: "AWS plan-only (ReadOnly + S3 state lockfile)"
              username: "${AWS_PLAN_ACCESS_KEY_ID}"
              password: "${AWS_PLAN_SECRET_ACCESS_KEY}"
          - usernamePassword:
              id: "aws-terraform-apply"
              scope: GLOBAL
              description: "AWS apply/write for management stack"
              username: "${AWS_APPLY_ACCESS_KEY_ID}"
              password: "${AWS_APPLY_SECRET_ACCESS_KEY}"
          - string:
              id: "tf-db-password"
              scope: GLOBAL
              description: "TF_VAR_db_password"
              secret: "${TF_DB_PASSWORD}"
          - string:
              id: "tf-stripe-secret-key"
              scope: GLOBAL
              description: "TF_VAR_stripe_secret_key"
              secret: "${TF_STRIPE_SECRET_KEY}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  globalLibraries:
    libraries:
      - name: "go-micro-ci"
        defaultVersion: "v1.1.3"
        implicit: false
        allowVersionOverride: false
        includeInChangesets: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/minhtri1612/go-micro-pipeline-lib.git"
                credentialsId: "github-go-micro-pat"

jobs:
  - file: /var/jenkins_home/casc_configs/jobs.groovy
